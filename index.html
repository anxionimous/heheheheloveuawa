<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Hand Flower</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#000;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      height:100vh;
      gap:12px;
      font-family:sans-serif;
    }

    #container{
      position:relative;
      width:640px;
      height:480px;
      border-radius:12px;
      overflow:hidden;
    }

    video{
      display:none;
    }

    canvas{
      position:absolute;
      top:0;
      left:0;
      width:640px;
      height:480px;
    }

    /* overlay */
    #overlay{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,0.88);
      gap:14px;
      z-index:10;
    }

    #overlay p{
      color:#ccc;
      font-size:13px;
      text-align:center;
      line-height:1.9;
    }

    #btn{
      padding:12px 32px;
      background:#e8557a;
      color:#fff;
      border:none;
      border-radius:8px;
      font-size:15px;
      cursor:pointer;
      font-weight:600;
      opacity:0.4;
      pointer-events:none;
      transition:opacity .2s;
    }

    #btn.ready{
      opacity:1;
      pointer-events:all;
    }

    #info{
      position:absolute;
      bottom:12px;
      left:12px;
      right:12px;
      display:none;
      justify-content:space-between;
      pointer-events:none;
    }

    #info span{
      background:rgba(0,0,0,0.55);
      color:#fff;
      font-size:11px;
      padding:4px 10px;
      border-radius:6px;
    }

    #status{
      position:absolute;
      top:10px;
      left:50%;
      transform:translateX(-50%);
      background:rgba(0,0,0,0.5);
      color:#fff;
      font-size:12px;
      padding:4px 14px;
      border-radius:20px;
      display:none;
      white-space:nowrap;
    }
  </style>
</head>

<body>

<div id="container">

  <video id="video" autoplay playsinline muted></video>

  <canvas id="canvas" width="640" height="480"></canvas>

  <!-- overlay -->
  <div id="overlay">

    <div style="font-size:40px">🌸</div>

    <p>
      <b style="color:#b8e4ff">✋ Tangan Kiri</b> — Buka → Ranting Tumbuh<br>
      <b style="color:#ffb8d4">🤚 Tangan Kanan</b> — Buka → Bunga Mekar
    </p>

    <div id="loadingMsg"
         style="color:#888;font-size:12px;min-height:18px;">
    </div>

    <button id="btn">Aktifkan Kamera</button>

  </div>

  <div id="info">
    <span style="color:#b8e4ff">left hand: twigs</span>
    <span style="color:#ffb8d4">right hand: flower</span>
  </div>

  <div id="status"></div>

</div>

<script>

  const video    = document.getElementById('video');
  const canvas   = document.getElementById('canvas');
  const ctx      = canvas.getContext('2d');

  const overlay  = document.getElementById('overlay');
  const info     = document.getElementById('info');
  const statusEl = document.getElementById('status');
  const loadMsg  = document.getElementById('loadingMsg');
  const btn      = document.getElementById('btn');

  let hasilTangan  = null;
  let tick         = 0;

  let nilaiRanting = 0;
  let nilaiBunga   = 0;

  let cabang       = [];
  let ujungCabang  = [];

  /* =========================
     FOTO BUNGA CUSTOM
  ========================= */

  let fotoBunga = new Image();

  fotoBunga.src = "https://cdn.corenexis.com/files/c/8616464720.png";
  // ganti sesuai nama/path image lo

  fotoBunga.onload = () => {
    btn.classList.add('ready');
  };

  /* ========================= */

  const POHON_X = 180;
  const POHON_Y = 480;

  /* =========================
     TOMBOL START
  ========================= */

  btn.onclick = function(){

    loadMsg.textContent =
      'Memuat model AI... tunggu ~10 detik';

    this.disabled = true;
    this.textContent = 'Memuat...';

    mulaiTracking();
  };

  /* =========================
     MEDIAPIPE
  ========================= */

  function mulaiTracking(){

    const hands = new Hands({
      locateFile:f =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });

    hands.setOptions({
      maxNumHands:2,
      modelComplexity:1,
      minDetectionConfidence:0.7,
      minTrackingConfidence:0.5
    });

    hands.onResults(r=>{
      hasilTangan = r;
    });

    const camera = new Camera(video,{
      onFrame:async()=>{
        await hands.send({ image:video });

        gambarFrame();

        tick++;
      },

      width:640,
      height:480
    });

    camera.start().then(()=>{

      overlay.style.display  = 'none';
      info.style.display     = 'flex';
      statusEl.style.display = 'block';

      inisialisasiPohon();

    }).catch(err=>{

      loadMsg.textContent =
        'Error: ' + err.message;

      btn.disabled = false;
      btn.textContent = 'Coba Lagi';
    });
  }

  /* =========================
     POHON
  ========================= */

  function inisialisasiPohon(){

    cabang = [];
    ujungCabang = [];

    buatCabang(
      POHON_X,
      POHON_Y,
      -Math.PI / 2,
      100,
      0
    );
  }

  function buatCabang(
    x1,
    y1,
    sudut,
    panjang,
    depth
  ){

    if(depth > 4 || panjang < 12) return;

    const x2 =
      x1 + Math.cos(sudut) * panjang;

    const y2 =
      y1 + Math.sin(sudut) * panjang;

    const node = {
      x1,
      y1,
      x2,
      y2,
      depth
    };

    cabang.push(node);

    if(depth < 4){

      const spread =
        0.44 + depth * 0.05;

      buatCabang(
        x2,
        y2,
        sudut - spread,
        panjang * 0.67,
        depth + 1
      );

      buatCabang(
        x2,
        y2,
        sudut + spread,
        panjang * 0.67,
        depth + 1
      );

      if(depth < 2){

        buatCabang(
          x2,
          y2,
          sudut,
          panjang * 0.54,
          depth + 1
        );
      }

    }else{

      ujungCabang.push(node);
    }
  }

  /* =========================
     DETEKSI JARAK
  ========================= */

  function jarakJempolTelunjuk(tangan){

    const j = tangan[4];
    const t = tangan[8];

    const w = tangan[0];
    const m = tangan[9];

    const jarak =
      Math.hypot(
        j.x - t.x,
        j.y - t.y
      );

    const skala =
      Math.hypot(
        w.x - m.x,
        w.y - m.y
      );

    if(skala === 0) return 0;

    return Math.min(
      1,
      Math.max(
        0,
        (jarak / skala - 0.1) / 0.75
      )
    );
  }

  function lm(tangan, i){

    return{
      x:(1 - tangan[i].x) * 640,
      y:tangan[i].y * 480
    };
  }

  /* =========================
     TRACKER VISUAL
  ========================= */

  function gambarTracker(
    tangan,
    warna,
    nilai
  ){

    const jempol   = lm(tangan,4);
    const telunjuk = lm(tangan,8);

    const mx =
      (jempol.x + telunjuk.x) / 2;

    const my =
      (jempol.y + telunjuk.y) / 2;

    /* garis */
    ctx.save();

    ctx.setLineDash([5,5]);

    ctx.strokeStyle = warna;
    ctx.lineWidth   = 1.5;

    ctx.globalAlpha = 0.85;

    ctx.shadowColor = warna;
    ctx.shadowBlur  = 6;

    ctx.beginPath();

    ctx.moveTo(jempol.x,jempol.y);
    ctx.lineTo(telunjuk.x,telunjuk.y);

    ctx.stroke();

    ctx.restore();

    /* titik */
    [jempol,telunjuk].forEach(p=>{

      ctx.save();

      ctx.fillStyle = warna;

      ctx.shadowColor = warna;
      ctx.shadowBlur  = 10;

      ctx.globalAlpha = 0.95;

      ctx.beginPath();
      ctx.arc(p.x,p.y,5,0,Math.PI*2);
      ctx.fill();

      ctx.restore();
    });

    /* persen */
    const persen =
      Math.round(nilai * 100);

    ctx.save();

    ctx.font =
      'bold 12px sans-serif';

    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';

    const tw =
      ctx.measureText(
        persen + '%'
      ).width + 14;

    ctx.fillStyle =
      'rgba(0,0,0,0.6)';

    ctx.globalAlpha = 0.9;

    roundRect(
      ctx,
      mx - tw/2,
      my - 10,
      tw,
      20,
      10
    );

    ctx.fill();

    ctx.globalAlpha = 1;

    ctx.fillStyle   = warna;
    ctx.shadowColor = warna;
    ctx.shadowBlur  = 6;

    ctx.fillText(
      persen + '%',
      mx,
      my
    );

    ctx.restore();

    /* progress */
    const bx = mx - 30;
    const by = my + 16;

    ctx.save();

    ctx.globalAlpha = 0.4;
    ctx.fillStyle   = '#444';

    roundRect(
      ctx,
      bx,
      by,
      60,
      5,
      3
    );

    ctx.fill();

    ctx.globalAlpha = 0.95;

    ctx.fillStyle   = warna;
    ctx.shadowColor = warna;
    ctx.shadowBlur  = 8;

    roundRect(
      ctx,
      bx,
      by,
      60 * nilai,
      5,
      3
    );

    ctx.fill();

    ctx.restore();
  }

  function roundRect(
    ctx,
    x,
    y,
    w,
    h,
    r
  ){

    ctx.beginPath();

    ctx.moveTo(x+r,y);

    ctx.lineTo(x+w-r,y);

    ctx.quadraticCurveTo(
      x+w,
      y,
      x+w,
      y+r
    );

    ctx.lineTo(
      x+w,
      y+h-r
    );

    ctx.quadraticCurveTo(
      x+w,
      y+h,
      x+w-r,
      y+h
    );

    ctx.lineTo(x+r,y+h);

    ctx.quadraticCurveTo(
      x,
      y+h,
      x,
      y+h-r
    );

    ctx.lineTo(x,y+r);

    ctx.quadraticCurveTo(
      x,
      y,
      x+r,
      y
    );

    ctx.closePath();
  }

  /* =========================
     LOOP UTAMA
  ========================= */

  function gambarFrame(){

    ctx.save();

    ctx.scale(-1,1);

    ctx.drawImage(
      video,
      -640,
      0,
      640,
      480
    );

    ctx.restore();

    ctx.fillStyle =
      'rgba(0,0,0,0.20)';

    ctx.fillRect(
      0,
      0,
      640,
      480
    );

    let bukaKiri  = 0;
    let bukaKanan = 0;

    let rawKiri   = null;
    let rawKanan  = null;

    if(
      hasilTangan &&
      hasilTangan.multiHandLandmarks
    ){

      hasilTangan.multiHandLandmarks
      .forEach((tangan,i)=>{

        const label =
          hasilTangan
          .multiHandedness[i]
          .label;

        if(label === 'Right'){

          bukaKiri =
            jarakJempolTelunjuk(tangan);

          rawKiri = tangan;

        }else{

          bukaKanan =
            jarakJempolTelunjuk(tangan);

          rawKanan = tangan;
        }
      });
    }

    nilaiRanting = bukaKiri;

    nilaiBunga =
      nilaiRanting > 0.1
      ? bukaKanan
      : 0;

    if(nilaiRanting < 0.1){

      statusEl.textContent =
        'buka jempol dan telunjuk tangan kiri';

    }else if(nilaiBunga < 0.1){

      statusEl.textContent =
        'coba sekarang yang kanan';

    }else{

      statusEl.textContent = '';
    }

    gambarPohon();

    if(nilaiRanting > 0.05){

      gambarSemuaBunga();
    }

    if(rawKiri){

      gambarTracker(
        rawKiri,
        '#7ec8ff',
        bukaKiri
      );
    }

    if(rawKanan){

      gambarTracker(
        rawKanan,
        '#ff88bb',
        bukaKanan
      );
    }
  }

  /* =========================
     RENDER RANTING
  ========================= */

  function gambarPohon(){

    cabang.forEach(node=>{

      const mulai =
        node.depth / 5;

      const selesai =
        (node.depth + 1) / 5;

      const p = Math.min(
        1,
        Math.max(
          0,
          (
            nilaiRanting - mulai
          ) / (
            selesai - mulai
          )
        )
      );

      if(p <= 0) return;

      const cx =
        node.x1 +
        (node.x2 - node.x1) * p;

      const cy =
        node.y1 +
        (node.y2 - node.y1) * p;

      ctx.save();

      ctx.strokeStyle =
        `rgba(215,235,255,${
          0.6 + node.depth * 0.07
        })`;

      ctx.lineWidth =
        Math.max(
          0.5,
          (5 - node.depth)
        );

      ctx.lineCap = 'round';

      ctx.shadowColor =
        'rgba(140,190,255,0.7)';

      ctx.shadowBlur =
        node.depth < 2 ? 8 : 3;

      ctx.beginPath();

      ctx.moveTo(
        node.x1,
        node.y1
      );

      ctx.lineTo(cx,cy);

      ctx.stroke();

      ctx.restore();
    });
  }

  /* =========================
     BUNGA
  ========================= */

  function gambarSemuaBunga(){

    ujungCabang.forEach((node,i)=>{

      const mulai =
        node.depth / 5;

      const selesai =
        (node.depth + 1) / 5;

      const pr = Math.min(
        1,
        Math.max(
          0,
          (
            nilaiRanting - mulai
          ) / (
            selesai - mulai
          )
        )
      );

      if(pr < 0.5) return;

      const cx =
        node.x1 +
        (node.x2 - node.x1) * pr;

      const cy =
        node.y1 +
        (node.y2 - node.y1) * pr;

      const delay =
        (i % ujungCabang.length)
        * (
          0.5 / ujungCabang.length
        );

      const bloom = Math.min(
        1,
        Math.max(
          0,
          (
            nilaiBunga - delay
          ) / (
            1 - delay + 0.001
          )
        )
      );

      gambarFotoBunga(
        cx,
        cy,
        bloom,
        i
      );
    });
  }

  /* =========================
     FOTO BUNGA
  ========================= */

  function gambarFotoBunga(
    x,
    y,
    bloom,
    idx
  ){

    if(
      !fotoBunga ||
      bloom <= 0.01
    ) return;

    const ukuran =
      (
        40 +
        (idx % 4) * 8
      ) * bloom;

    const rotasi =
      tick * 0.008 +
      idx * 0.5;

    ctx.save();

    ctx.globalAlpha = bloom;

    ctx.translate(x,y);

    ctx.rotate(rotasi);

    /* lingkaran */
    ctx.beginPath();

    ctx.arc(
      0,
      0,
      ukuran / 2,
      0,
      Math.PI * 2
    );

    ctx.clip();

    ctx.drawImage(
      fotoBunga,
      -ukuran / 2,
      -ukuran / 2,
      ukuran,
      ukuran
    );

    ctx.restore();

    /* glow */
    ctx.save();

    ctx.globalAlpha =
      0.35 * bloom;

    const grad =
      ctx.createRadialGradient(
        x,
        y,
        ukuran * 0.3,
        x,
        y,
        ukuran * 0.8
      );

    grad.addColorStop(0,'#ffccdd');
    grad.addColorStop(1,'transparent');

    ctx.fillStyle = grad;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      ukuran * 0.8,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
  }

</script>

</body>
</html>
